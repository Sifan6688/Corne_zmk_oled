# OLED Display 
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

CONFIG_ADC=y
CONFIG_ZMK_MOUSE=y
# Enable Battery Monitoring
CONFIG_BATTERY=y
CONFIG_ZMK_BATTERY_MONITOR=y
